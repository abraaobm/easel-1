name: Build FM1 preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build preview
        shell: pwsh
        run: |
          $env:FM1_SOURCE_URL = "https://github.com/${{ github.repository }}"
          .\tools\Build-Web.ps1 -LocalPreview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
